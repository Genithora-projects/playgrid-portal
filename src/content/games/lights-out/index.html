<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover" />
		<meta name="theme-color" content="#0c0c10" />
		<title>Lights Out</title>
		<style>
			:root { color-scheme: dark; }
			[hidden] { display: none !important; }
			*, *::before, *::after { box-sizing: border-box; }
			html, body {
				margin: 0; padding: 0; width: 100%; min-height: 100dvh;
				background: #0c0c10; color: #f4f4f5;
				font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
				touch-action: manipulation; user-select: none; -webkit-user-select: none;
			}
			.stage {
				display: flex; flex-direction: column; align-items: center; gap: 14px;
				padding: 14px 18px max(14px, env(safe-area-inset-bottom));
			}
			.hud {
				display: flex; gap: 14px; justify-content: center; align-items: center;
				font-weight: 600; font-size: 14px; flex-wrap: wrap;
			}
			.hud-stat {
				display: inline-flex; align-items: center; gap: 6px;
				padding: 6px 12px; border-radius: 999px;
				background: rgba(255,255,255,0.06); backdrop-filter: blur(6px);
				font-variant-numeric: tabular-nums;
			}
			.hud-stat .icon { width: 16px; height: 16px; }
			.board-wrap {
				position: relative;
				display: flex; align-items: center; justify-content: center;
				width: 100%; max-width: 520px;
			}
			.board {
				display: grid; gap: 6px;
				width: min(86vw, 480px); aspect-ratio: 1;
				padding: 8px;
				background: rgba(255,255,255,0.04); border-radius: 14px;
				border: 1px solid rgba(255,255,255,0.06);
			}
			.cell {
				appearance: none; border: none; padding: 0; margin: 0; cursor: pointer;
				border-radius: 8px;
				background: rgba(14,165,233,0.12);
				color: #38bdf8;
				transition: background-color 100ms ease, transform 100ms ease;
				aspect-ratio: 1;
				min-width: 0;
			}
			.cell.is-on {
				background: #0ea5e9;
				box-shadow: 0 0 16px rgba(14,165,233,0.5);
			}
			.cell.is-off {
				background: #18181c;
				color: #3f3f46;
			}
			.cell:active { transform: scale(0.94); }
			.overlay {
				position: absolute; inset: 0; display: flex; flex-direction: column;
				align-items: center; justify-content: center; gap: 12px;
				background: rgba(0,0,0,0.55); backdrop-filter: blur(6px);
				color: #f4f4f5; text-align: center; padding: 24px; z-index: 5;
				border-radius: 14px;
			}
			.overlay h2 { margin: 0; font-size: 32px; }
			.overlay p  { margin: 0; font-size: 16px; opacity: 0.85; max-width: 320px; }
			.overlay button {
				appearance: none; border: none; padding: 12px 24px; cursor: pointer;
				background: #0ea5e9; color: #052e1c;
				border-radius: 999px; font: inherit; font-weight: 700;
				box-shadow: 0 6px 18px rgba(14,165,233,0.35);
			}
			.hint { font-size: 13px; color: rgba(244,244,245,0.6); text-align: center; max-width: 480px; }
		</style>
	</head>
	<body>
		<div class="stage" role="application" aria-label="Lights Out">
			<div class="hud" aria-live="polite">
				<div class="hud-stat">
					<svg class="icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2 14.39 8.5 21 9.27l-5 4.87L17.18 21 12 17.77 6.82 21 8 14.14l-5-4.87 6.61-.77z"/></svg>
					<span id="score">0</span>
				</div>
				<div class="hud-stat">Level <span id="level">1</span></div>
				<div class="hud-stat" id="time-stat">
					<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 16 14"/></svg>
					<span id="time">75.0s</span>
				</div>
			</div>
			<div class="board-wrap">
				<div class="board" id="board"></div>
				<div class="overlay" id="overlay">
					<h2 id="overlay-title">Tap to start</h2>
					<p id="overlay-msg">Tap a tile to toggle it and its four neighbors. Turn the whole board off.</p>
					<button id="overlay-btn">Start</button>
				</div>
			</div>
			<p class="hint">Tip: <kbd>1</kbd>–<kbd>9</kbd>, <kbd>Q</kbd>–<kbd>O</kbd>, <kbd>A</kbd>–<kbd>L</kbd>, <kbd>Z</kbd>–<kbd>M</kbd> toggle cells in keyboard layout. <kbd>R</kbd> reshuffles.</p>
		</div>
		<script type="module">
			import { createGame, fixedTimestep } from '/sdk/sdk.mjs';

			const SIZE = 5;
			const LOOP_SECONDS = 75;
			const ROUND_SECONDS_BONUS = 15;
			const SEED_DENSITY = 0.35;

			const game = createGame({
				slug: 'lights-out',
				sdkVersion: 1,
				onPause() { state.paused = true; },
				onResume() { state.paused = false; lastTs = performance.now(); },
				onMute() {},
			});

			const boardEl = document.getElementById('board');
			const overlay = document.getElementById('overlay');
			const overlayTitle = document.getElementById('overlay-title');
			const overlayMsg = document.getElementById('overlay-msg');
			const overlayBtn = document.getElementById('overlay-btn');
			const scoreEl = document.getElementById('score');
			const levelEl = document.getElementById('level');
			const timeEl = document.getElementById('time');
			const timeStat = document.getElementById('time-stat');

			const KEY_MAP = {
				'1': 0, '2': 1, '3': 2, '4': 3, '5': 4,
				'q': 5, 'w': 6, 'e': 7, 'r': 8, 't': 9,
				'a': 10, 's': 11, 'd': 12, 'f': 13, 'g': 14,
				'z': 15, 'x': 16, 'c': 17, 'v': 18, 'b': 19,
				'Q': 5, 'W': 6, 'E': 7, 'R': 8, 'T': 9,
				'A': 10, 'S': 11, 'D': 12, 'F': 13, 'G': 14,
				'Z': 15, 'X': 16, 'C': 17, 'V': 18, 'B': 19,
			};

			let lastTs = performance.now();
			let state = fresh();

			function fresh() {
				return {
					phase: 'idle',
					score: 0,
					level: 1,
					timeLeft: LOOP_SECONDS,
					paused: false,
					board: emptyBoard(),
					cells: [],
				};
			}

			function emptyBoard() {
				return Array.from({ length: SIZE }, () => Array(SIZE).fill(0));
			}

			function randomBoard(density) {
				const board = emptyBoard();
				for (let r = 0; r < SIZE; r++) {
					for (let c = 0; c < SIZE; c++) {
						if (Math.random() < density) board[r][c] = 1;
					}
				}
				return board;
			}

			function cloneBoard(b) {
				return b.map((row) => row.slice());
			}

			function isSolved(board) {
				for (let r = 0; r < SIZE; r++) {
					for (let c = 0; c < SIZE; c++) {
						if (board[r][c] !== 0) return false;
					}
				}
				return true;
			}

			function toggleAt(board, r, c) {
				if (r < 0 || r >= SIZE || c < 0 || c >= SIZE) return;
				board[r][c] = board[r][c] ? 0 : 1;
			}

			function applyClick(board, r, c) {
				const next = cloneBoard(board);
				toggleAt(next, r, c);
				toggleAt(next, r - 1, c);
				toggleAt(next, r + 1, c);
				toggleAt(next, r, c - 1);
				toggleAt(next, r, c + 1);
				return next;
			}

			function renderBoard() {
				if (!boardEl) return;
				const grid = state.board;
				if (state.cells.length !== SIZE * SIZE) {
					boardEl.innerHTML = '';
					state.cells = [];
					for (let r = 0; r < SIZE; r++) {
						for (let c = 0; c < SIZE; c++) {
							const el = document.createElement('button');
							el.className = 'cell';
							el.type = 'button';
							el.style.gridRow = String(r + 1);
							el.style.gridColumn = String(c + 1);
							el.setAttribute('aria-label', 'Toggle row ' + (r + 1) + ' column ' + (c + 1));
							el.addEventListener('click', () => onCell(r, c));
							boardEl.appendChild(el);
							state.cells.push(el);
						}
					}
					boardEl.style.gridTemplateColumns = 'repeat(' + SIZE + ', 1fr)';
					boardEl.style.gridTemplateRows = 'repeat(' + SIZE + ', 1fr)';
				}
				for (let r = 0; r < SIZE; r++) {
					for (let c = 0; c < SIZE; c++) {
						const idx = r * SIZE + c;
						const on = grid[r][c];
						state.cells[idx].classList.toggle('is-on', !!on);
						state.cells[idx].classList.toggle('is-off', !on);
						state.cells[idx].setAttribute('aria-pressed', on ? 'true' : 'false');
					}
				}
			}

			function onCell(r, c) {
				if (state.phase !== 'playing') return;
				state.board = applyClick(state.board, r, c);
				renderBoard();
				if (isSolved(state.board)) {
					state.score += 100 + Math.floor(state.timeLeft);
					state.level++;
					state.timeLeft = Math.min(LOOP_SECONDS, state.timeLeft + ROUND_SECONDS_BONUS);
					overlayTitle.textContent = 'Solved';
					overlayMsg.textContent = 'Round complete. Score + ' + (100 + Math.floor(state.timeLeft - ROUND_SECONDS_BONUS)) + '. Bonus time added.';
					overlayBtn.textContent = 'Continue';
					overlay.style.display = 'flex';
					state.phase = 'paused';
					game.reportScore(state.score);
				}
			}

			function newRound() {
				state.board = randomBoard(Math.min(0.55, SEED_DENSITY + state.level * 0.03));
				state.phase = 'playing';
				overlay.style.display = 'none';
				renderBoard();
			}

			function startGame() {
				state = fresh();
				renderBoard();
				lastTs = performance.now();
				newRound();
				loop.tick();
			}

			function endGame() {
				state.phase = 'gameover';
				game.reportGameover(state.score, { level: state.level });
				overlayTitle.textContent = 'Time’s up';
				overlayMsg.textContent = 'You cleared ' + (state.level - 1) + ' rounds and scored ' + state.score + '.';
				overlayBtn.textContent = 'Play again';
				overlay.style.display = 'flex';
			}

			function update(dt) {
				if (state.phase !== 'playing') return;
				state.timeLeft = Math.max(0, state.timeLeft - dt);
				if (state.timeLeft <= 0) endGame();
			}

			function paint() {
				scoreEl.textContent = String(state.score);
				levelEl.textContent = String(state.level);
				timeEl.textContent = state.timeLeft.toFixed(1) + 's';
				timeStat.classList.toggle('is-low', state.timeLeft < 10);
			}

			const loop = fixedTimestep({ stepHz: 30, onUpdate: update, onFrame: paint });

			function bindInput() {
				boardEl.addEventListener('pointerdown', () => {
					if (state.phase === 'idle' || state.phase === 'gameover') {
						startGame();
					}
				});
				window.addEventListener('keydown', (e) => {
					if (e.key === 'r' || e.key === 'R') {
						if (state.phase === 'playing') {
							state.board = randomBoard(Math.min(0.55, SEED_DENSITY + state.level * 0.03));
							renderBoard();
						}
						return;
					}
					if (e.key === 'Enter' || e.key === ' ') {
						e.preventDefault();
						if (state.phase === 'idle' || state.phase === 'gameover') startGame();
						else if (state.phase === 'paused') newRound();
						return;
					}
					const idx = KEY_MAP[e.key];
					if (idx != null) {
						const r = Math.floor(idx / SIZE);
						const c = idx % SIZE;
						onCell(r, c);
					}
				});
				overlayBtn.addEventListener('click', (e) => {
					e.stopPropagation();
					if (state.phase === 'gameover') startGame();
					else if (state.phase === 'paused') newRound();
				});
			}

			renderBoard();
			bindInput();
			game.ready();
		</script>
	</body>
</html>
