<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img" aria-label="Bouncing Ball cover — bricks and a paddle">
	<defs>
		<linearGradient id="bbg" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0%" stop-color="#1f1300"/>
			<stop offset="100%" stop-color="#0c0c10"/>
		</linearGradient>
	</defs>
	<rect width="800" height="400" fill="url(#bbg)"/>
	<g>
		<rect x="80"  y="60" width="80" height="22" rx="3" fill="#dc2626"/>
		<rect x="180" y="60" width="80" height="22" rx="3" fill="#f97316"/>
		<rect x="280" y="60" width="80" height="22" rx="3" fill="#facc15"/>
		<rect x="380" y="60" width="80" height="22" rx="3" fill="#22c55e"/>
		<rect x="480" y="60" width="80" height="22" rx="3" fill="#06b6d4"/>
		<rect x="80"  y="90" width="80" height="22" rx="3" fill="#f97316"/>
