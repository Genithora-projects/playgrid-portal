<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" role="img" aria-label="Color Tiles cover — four colorful tiles, one is the target">
	<defs>
		<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0%" stop-color="#1e1b4b"/>
			<stop offset="100%" stop-color="#0c0c10"/>
		</linearGradient>
	</defs>
	<rect width="800" height="800" fill="url(#bg)"/>
	<g>
		<rect x="160" y="180" width="200" height="200" rx="36" fill="#6366f1"/>
		<rect x="440" y="180" width="200" height="200" rx="36" fill="#f59e0b"/>
		<rect x="160" y="420" width="200" height="200" rx="36" fill="#10b981"/>
		<rect x="440" y="420" width="200" height="200" rx="36" fill="#f43f5e"/>
	</g>
	<g stroke="#ffffff" stroke-width="8" fill="none">
		<rect x="148" y="168" width="224" height="224" rx="44" opacity="0.95"/>
	</g>
	<g fill="#ffffff" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" text-anchor="middle">
		<text x="400" y="84" font-size="56" font-weight="800" letter-spacing="-0.02em">Color Tiles</text>
		<text x="400" y="734" font-size="22" font-weight="500" opacity="0.7">Tap the matching color</text>
	</g>
</svg>
